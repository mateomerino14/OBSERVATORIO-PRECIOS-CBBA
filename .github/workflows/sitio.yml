name: Sitio

# Publica el dashboard en GitHub Pages: después de cada recolección diaria, con cada
# cambio del sitio o del exportador en main, o a mano.
on:
  workflow_run:
    workflows: ["Recolección diaria"]
    types: [completed]
  push:
    branches: [main]
    paths: ["web/**", "src/**", "canastas/**", "pyproject.toml", ".github/workflows/sitio.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar el exportador
        run: pip install -e .
      - name: Emparejar la canasta con las reglas vigentes
        run: observatorio canasta cargar canastas/defensoria_semanal.toml
      - name: Exportar los datos del dashboard
        run: observatorio exportar --canasta canastas/defensoria_semanal.toml --salida web/public/data/dashboard.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar dependencias del sitio
        working-directory: web
        run: npm ci
      - name: Pruebas del sitio
        working-directory: web
        run: npm test
      - name: Construir
        working-directory: web
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
