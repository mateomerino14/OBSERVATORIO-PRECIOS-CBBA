name: Recolección diaria

on:
  schedule:
    # 07:17 en Bolivia (11:17 UTC), fuera de la hora punta de los cron de GitHub
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      limite:
        description: "Máximo de productos (vacío = todos)"
        required: false

concurrency:
  group: recoleccion
  cancel-in-progress: false

jobs:
  hipermaxi:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PAUSA_SEGUNDOS: "1.5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -e .
      - name: Aplicar migraciones
        run: observatorio migrar
      - name: Recolectar Hipermaxi Cochabamba
        env:
          LIMITE: ${{ inputs.limite }}
        run: |
          if [ -n "$LIMITE" ]; then
            observatorio recolectar hipermaxi --ciudad cochabamba --limite "$LIMITE"
          else
            observatorio recolectar hipermaxi --ciudad cochabamba
          fi
