[project]
name = "observatorio-precios-cbba"
version = "0.1.0"
description = "Observatorio de precios de la canasta familiar en supermercados de Cochabamba"
authors = [{ name = "Mateo Alejandro Merino Vidal" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pdfplumber>=0.11",
    "selectolax>=1.0",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
observatorio = "observatory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/observatory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "db: pruebas que necesitan PostgreSQL (TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
