# Canasta básica de alimentos de la Defensoría del Pueblo de Bolivia.
#
# 13 productos, consumo semanal de una familia de cuatro personas. Se replica con
# precios de supermercado para compararla con el sondeo mensual de la Defensoría,
# que mide la misma canasta en mercados de las capitales.
#
# Unidades: todas las cantidades están en la unidad base del producto (g, ml o u).
# Supuestos de conversión:
#   - 1 libra = 460 g (libra usada en los mercados bolivianos).
#   - Productos que la Defensoría cuenta por unidad y el supermercado vende por kilo:
#     papaya mediana = 1.500 g; plátano mediano = 150 g.
#
# Cobertura: la tienda en línea de Hipermaxi casi no publica frutas y verduras frescas.
# Sus reglas se limitan a las subcategorías de frescos para no tomar conservas ni
# deshidratados; mientras no haya productos, esos ítems quedan sin precio y la vista
# costo_canasta_diario lo informa en items_con_precio / items_total.
#
# Reglas de emparejamiento de cada producto (se comparan sin tildes y en minúsculas):
#   incluir        al menos una expresión debe coincidir con el nombre
#   excluir        ninguna puede coincidir
#   subcategorias  subcategorías de la tienda donde se busca
#   contenido_min / contenido_max  presentación aceptada, en la unidad base
#                  (deja fuera bolsas al por mayor y envases de muestra)
#   peso_unidad    gramos de una pieza, para comparar con fuentes que cotizan
#                  por unidad (la Defensoría cotiza papaya y plátano así)

codigo = "defensoria_semanal"
nombre = "Canasta básica de alimentos (Defensoría del Pueblo)"
descripcion = "13 alimentos, consumo semanal de una familia de cuatro personas"
referencia = "https://www.defensoria.gob.bo/uploads/files/derecho-a-la-alimentacion-en-boliviareporte-del-sondeo-de-precios-de-productos-de-consumo-generaldiciembre-2025.pdf"
personas = 4
periodo = "semanal"

[[producto]]
codigo = "papaya"
nombre = "Papaya mediana"
categoria = "frutas"
unidad = "g"
cantidad = 1500  # 1 unidad
peso_unidad = 1500  # g por pieza, para comparar con precios por unidad
subcategorias = ["Frutas", "Verduras", "Temporada", "Ofertas Especiales", "Hortalizas Delifresh"]
incluir = ['^papaya\b']
excluir = ['deshidrat', 'mermelada', 'jugo', 'nectar', 'trozos', 'picada']

[[producto]]
codigo = "platano"
nombre = "Plátano o banano mediano"
categoria = "frutas"
unidad = "g"
cantidad = 1800  # 12 unidades
peso_unidad = 150  # g por pieza
subcategorias = ["Frutas", "Verduras", "Temporada", "Ofertas Especiales", "Hortalizas Delifresh"]
incluir = ['^(platano|banano|banana)s?\b']
excluir = ['postre', 'verde', 'cocinar', 'frit', 'chips?', 'harina', 'deshidrat', 'pure', 'colado', 'nectar', 'jugo']

[[producto]]
codigo = "cebolla"
nombre = "Cebolla"
categoria = "verduras"
unidad = "g"
cantidad = 920  # 2 libras
subcategorias = ["Frutas", "Verduras", "Temporada", "Ofertas Especiales", "Hortalizas Delifresh"]
incluir = ['^cebollas?\b']
excluir = ['polvo', 'deshidrat', 'verde', 'perla', 'encurtid', 'frita', 'cebollin', 'picada']

[[producto]]
codigo = "tomate"
nombre = "Tomate"
categoria = "verduras"
