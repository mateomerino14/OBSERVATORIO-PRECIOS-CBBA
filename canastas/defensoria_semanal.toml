cantidad = 920  # 2 libras
subcategorias = ["Frutas", "Verduras", "Temporada", "Ofertas Especiales", "Hortalizas Delifresh"]
incluir = ['^tomates?\b']
excluir = ['cherry', 'deshidrat', 'seco', 'pure', 'salsa', 'pasta', 'lata', 'cubeteado', 'triturado', 'jugo', 'pelado', 'extracto']

[[producto]]
codigo = "zanahoria"
nombre = "Zanahoria"
categoria = "verduras"
unidad = "g"
cantidad = 920  # 2 libras
subcategorias = ["Frutas", "Verduras", "Temporada", "Ofertas Especiales", "Hortalizas Delifresh"]
incluir = ['^zanahorias?\b']
